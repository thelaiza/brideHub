name: BrideHub CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bridehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- BACKEND ---
      - name: Instalar dependências do Backend
        run: cd backend && npm ci

      - name: Executar migrações do Prisma (Teste)
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/bridehub_test?schema=public
        run: cd backend && npx prisma migrate deploy

      - name: Build do Backend
        run: cd backend && npm run build --if-present

      # --- FRONTEND ---
      - name: Instalar dependências do Frontend
        run: cd frontend && npm ci

      - name: Build do Frontend
        env:
          VITE_API_URL: http://localhost:3333
        run: cd frontend && npm run build