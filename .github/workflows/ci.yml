name: BrideHub CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: bridehub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/bridehub_test?schema=public
      VITE_GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Vulnerabilidades em dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Prisma generate
        run: npx prisma generate

      - name: Migrações (banco de teste)
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present

      - name: Testes e Cobertura
        run: npm run test:coverage

      - name: Cobertura como artefato
        uses: actions/upload-artifact@v5
        with:
          name: coverage-backend
          path: backend/coverage/lcov.info
          if-no-files-found: error

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Vulnerabilidades em dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Testes e Cobertura
        run: npm run test:coverage

      - name: Build
        env:
          VITE_API_URL: /
          VITE_GOOGLE_CLIENT_ID: test-google-client-id.apps.googleusercontent.com
        run: npm run build

      - name: Cobertura como artefato
        uses: actions/upload-artifact@v5
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info
          if-no-files-found: error

  sonarcloud:
    name: SonarCloud Analysis
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Baixar cobertura do backend
        uses: actions/download-artifact@v5
        with:
          name: coverage-backend
          path: backend/coverage

      - name: Baixar cobertura do frontend
        uses: actions/download-artifact@v5
        with:
          name: coverage-frontend
          path: frontend/coverage

      - name: Ajustar caminhos do lcov para a raiz do monorepo
        run: |
          sed -i 's#^SF:\([^/]\)#SF:backend/\1#' backend/coverage/lcov.info
          sed -i 's#^SF:\([^/]\)#SF:frontend/\1#' frontend/coverage/lcov.info

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to EC2 (SSM)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: sa-east-1
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}

    steps:
      - name: Enviar comando de deploy via AWS SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy BrideHub from GitHub Actions" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/bridehub",
              "git fetch origin main",
              "git reset --hard origin/main",
              "docker compose up -d --build db api web",
              "docker compose ps"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Status ($i): $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "--- STDOUT ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              echo "--- STDERR ---"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "Timeout aguardando execução do SSM"
          exit 1