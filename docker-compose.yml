services:
  db:
    image: postgres:16-alpine
    container_name: bridehub_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bridehub_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bridehub_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bridehub_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bridehub_admin}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bridehub_admin}:${POSTGRES_PASSWORD:-bridehub_pass}@db:5432/${POSTGRES_DB:-bridehub_db}?schema=public
      API_PORT: 3333
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
    volumes:
      - api-uploads:/app/uploads
    ports:
      - '3333:3333'

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    depends_on:
      - api
    profiles: ['observability']

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ['observability']

  sonarqube:
    image: sonarqube:community
    container_name: bridehub_sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - SONAR_JDBC_USERNAME=postgres
      - SONAR_JDBC_PASSWORD=postgres
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    profiles: ['observability']

volumes:
  pgdata:
  grafana-data:
  api-uploads:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: